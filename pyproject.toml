[project]
name = "typesafe-agent-gates"
version = "0.1.0"
description = "Typed judgments from TypeSafe's System One models as LangChain / Deep Agents middleware: a shell-command gate, issue triage and routing, and three judgments that widen a fragile pattern."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0,<2.0",
    "langgraph>=1.2,<2.0",
    # Alpha: pin what you tested against.
    "langchain-typesafe>=0.0.1a2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typesafe_agent_gates"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
